<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>리포트 · AKME Research</title>
<link rel="stylesheet" href="site/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
</head>
<body>
<nav class="nav">
  <a class="brand" href="index.html">AKME Research</a>
  <a href="index.html">시장 현황</a>
  <a href="reports.html" class="cur">실적 리포트</a>
</nav>
<main class="wrap">
  <a class="back" href="reports.html">← 리포트 목록</a>
  <article id="doc" class="md"><div class="empty">불러오는 중…</div></article>
</main>
<script>
const f = new URLSearchParams(location.search).get('f') || '';
if (!/^[\w.-]+\.md$/.test(f)) {
  document.getElementById('doc').innerHTML = '<div class="empty">잘못된 주소입니다.</div>';
} else {
  fetch('data/reports/' + f + '?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(md => {
      const body = md.replace(/^---\n[\s\S]*?\n---\n/, '');
      const m = body.match(/^# (.+)$/m);
      if (m) document.title = m[1] + ' · AKME Research';
      document.getElementById('doc').innerHTML = marked.parse(body);
    })
    .catch(() => { document.getElementById('doc').innerHTML = '<div class="empty">리포트를 찾을 수 없습니다.</div>'; });
}
</script>
</body>
</html>
