<body>
<nav class="nav">
  <a class="brand" href="index.html"><img src="site/img/logo-dark.png" alt="AKME Research"></a>
  <a href="index.html">시장 현황</a>
  <a href="stocks.html">관심종목</a>
  <a href="reports.html" class="cur">실적 리포트</a>
</nav>
<main class="wrap">
  <a class="back" href="reports.html">← 리포트 목록</a>
  <article id="doc" class="md"><div class="empty">불러오는 중…</div></article>
</main>
<script>
const qs = new URLSearchParams(location.search);
const f = qs.get('f') || '';
const dir = qs.get('t') === 'weekly' ? 'data/weekly/' : 'data/reports/';
if (dir === 'data/weekly/') { const b = document.querySelector('.back'); b.href = 'weekly.html'; b.textContent = '← 위클리 목록'; document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('cur', a.getAttribute('href') === 'weekly.html')); }
if (!/^[\w.-]+\.md$/.test(f)) {
  document.getElementById('doc').innerHTML = '<div class="empty">잘못된 주소입니다.</div>';
} else {
  fetch(dir + f + '?v=' + Date.now())
    .then(r => { if (!r.ok) throw new Error(); return r.text(); })
    .then(md => {
      const body = md.replace(/^---\n[\s\S]*?\n---\n/, '');
      const m = body.match(/^# (.+)$/m);
      if (m) document.title = m[1] + ' · AKME Research';
      document.getElementById('doc').innerHTML = marked.parse(body);
    })
    .catch(() => { document.getElementById('doc').innerHTML = '<div class="empty">리포트를 찾을 수 없습니다.</div>'; });
}
</script>
</body>
</html>
