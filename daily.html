<main class="wrap">
  <h1>데일리</h1>
  <div class="sub">아침 7시 <b>전일 미국장</b>, 저녁 8시 <b>오늘 한국장</b>. 발행 즉시 텔레그램으로도 보냅니다.</div>
  <div class="tabs" id="tabs"><button class="tab on" data-k="">전체</button><button class="tab" data-k="us">미국장</button><button class="tab" data-k="kr">한국장</button></div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
  <div class="footer">정보 제공 목적이며 투자 권유가 아닙니다.</div>
</main>
<script>
let items = [], kind = '';
const KIND = { us: '미국장', kr: '한국장' };
function render() {
  const el = document.getElementById('list');
  const rows = items.filter(r => !kind || r.kind === kind);
  if (!rows.length) { el.innerHTML = '<div class="empty">아직 브리핑이 없습니다. 첫 발행은 다음 아침 7시(미국장) / 저녁 8시(한국장)입니다.</div>'; return; }
  el.innerHTML = rows.map(r => `
    <a class="card" href="report.html?t=daily&f=${encodeURIComponent(r.file)}">
      <div class="meta"><span class="tag">${KIND[r.kind] || r.kind}</span> ${r.date} · 발행 ${r.published}</div>
      <div class="title">${r.title}</div>
      <div class="summary">${r.summary}</div>
    </a>`).join('');
}
document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('.tab'); if (!b) return;
  kind = b.dataset.k; document.querySelectorAll('#tabs .tab').forEach(t => t.classList.toggle('on', t === b)); render();
});
fetch('data/daily/index.json?v=' + Date.now()).then(r => r.ok ? r.json() : []).then(j => { items = j; render(); })
  .catch(() => { items = []; render(); });
</script>
