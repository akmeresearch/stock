<main class="wrap wide">
  <h1>종목 스크린</h1>
  <div class="sc-toolbar">
    <input id="q" class="sc-input" type="search" placeholder="종목명 · 코드 · 업종 검색" autocomplete="off">
    <select id="mk" class="sc-select">
      <option value="">전체 시장</option>
      <option value="KOSPI">코스피</option>
      <option value="KOSDAQ">코스닥</option>
      <option value="ETF">ETF/ETN</option>
    </select>
    <select id="sec" class="sc-select"><option value="">전체 업종</option></select>
    <select id="cf" class="sc-select">
      <option value="">전체 클래스</option>
      <option value="_none">미분류</option>
      <option value="S">S</option><option value="A">A</option><option value="B">B</option><option value="C">C</option>
      <option value="D">D</option><option value="F">F</option><option value="P">P</option>
      <option value="_memo">메모 있음</option>
    </select>
    <label class="sc-check"><input id="showp" type="checkbox"> P 보기</label>
    <span class="sc-spacer"></span>
    <div class="sc-menu">
      <button id="menu-btn" class="btn" title="저장·백업">⋯</button>
      <div id="menu" class="sc-menu-list" hidden>
        <button id="save" class="mi">지금 저장</button>
        <button id="export" class="mi">JSON 내보내기</button>
        <button id="import" class="mi">JSON 가져오기</button>
        <button id="token" class="mi">GitHub 토큰 설정</button>
      </div>
    </div>
    <input id="file" type="file" accept="application/json" hidden>
  </div>
  <div id="stats" class="sc-stats"></div>
  <div id="hint" class="sc-hint" hidden>입력한 클래스·메모는 지금 이 브라우저에만 저장되고 있습니다. 다른 PC·폰에서도 보려면 <b>⋯ → GitHub 토큰 설정</b>을 한 번만 해주세요. 그 뒤로는 자동으로 저장·동기화됩니다.</div>

  <div id="pager-top" class="sc-pager"></div>
  <div class="sc-tablewrap">
    <table class="sc-table">
      <thead><tr>
        <th data-k="name" class="sortable">종목</th>
        <th data-k="sector" class="sortable">업종</th>
        <th data-k="cls" class="sortable sc-cls-h">클래스</th>
        <th>메모</th>
      </tr></thead>
      <tbody id="rows"><tr><td colspan="4" class="empty">불러오는 중…</td></tr></tbody>
    </table>
  </div>
  <div class="sc-pager"></div>
  <div class="footer">종목 목록: KRX KIND 상장법인목록 · 네이버 금융 ETF/ETN 목록 (주 1회 갱신). 정보 제공 목적이며 투자 권유가 아닙니다.</div>
