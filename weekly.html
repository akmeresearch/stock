<main class="wrap">
  <h1>위클리</h1>
  <div class="sub">한 주의 지수·수급·심리·관심종목을 묶어 읽습니다. 매주 일요일 저녁 자동 발행.</div>
  <div id="list"><div class="empty">불러오는 중…</div></div>
  <div class="footer">정보 제공 목적이며 투자 권유가 아닙니다.</div>
</main>
<script>
fetch('data/weekly/index.json?v=' + Date.now())
  .then(r => r.json())
  .then(items => {
    const el = document.getElementById('list');
    if (!items.length) { el.innerHTML = '<div class="empty">아직 브리핑이 없습니다. 첫 발행은 다음 일요일입니다.</div>'; return; }
    el.innerHTML = items.map(r => `
      <a class="card" href="report.html?t=weekly&f=${encodeURIComponent(r.file)}">
        <div class="meta">${r.week_start} ~ ${r.week_end} · 발행 ${r.published}</div>
        <div class="title">${r.title}</div>
        <div class="summary">${r.summary}</div>
      </a>`).join('');
  })
  .catch(() => { document.getElementById('list').innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>'; });
</script>
</body>
