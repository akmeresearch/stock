name: Order backlog (수주잔고)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "이번 실행 최대 추출 건수"
        required: false
        default: "80"
  schedule:
    - cron: "30 8 * * 1-5"   # 평일 17:30 KST — 새 분기보고서가 있으면 추출

permissions:
  contents: write

jobs:
  backlog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Extract order backlog from DART filings
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/collect_backlog.py --years 3 --limit ${{ inputs.limit || 20 }}
      - name: Commit
        run: |
          git config user.name "akme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/backlog.json data/backlog_watch.json
          git diff --cached --quiet || git commit -m "data: backlog $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
