name: Collect market data

on:
  workflow_dispatch:        # Actions 탭에서 수동 실행
  # schedule:               # 2단계에서 스크립트 완성 후 주석 해제
  #   - cron: "10 7 * * 1-5"   # 평일 16:10 KST (UTC 07:10)

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect data
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python scripts/collect_all.py

      - name: Commit data
        run: |
          git config user.name "akme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%d) collect"
          git push
