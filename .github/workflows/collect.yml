name: Collect market data

on:
  workflow_dispatch:
  schedule:
    # KST 08:30~16:00 평일 30분 간격 (UTC 23:30~07:00), 미국장 반영 위해 KST 23:30·02:30·06:00 추가
    - cron: "30,0 23 * * 0-4"
    - cron: "0,30 0-6 * * 1-5"
    - cron: "0 7 * * 1-5"
    - cron: "30 14 * * 1-5"
    - cron: "30 17 * * 1-5"
    - cron: "0 21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve DART corp codes
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/resolve_corp_codes.py

      - name: Collect data
        run: python scripts/collect_all.py

      - name: Collect KIS investor flows
        continue-on-error: true
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python scripts/collect_kis.py

      - name: Commit market data (fast path)
        run: |
          git config user.name "akme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M) collect"
          git pull --rebase origin main
          git push

      - name: Collect DART financials
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/dart_financials.py

      - name: Detect earnings filings & generate reports
        id: detect
        continue-on-error: true
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/detect_filings.py --days 14

      - name: Build report index
        run: python scripts/build_index.py

      - name: Telegram — new reports
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/notify.py --reports

      - name: Commit financials & reports
        run: |
          git add data/
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M) financials/reports"
          git pull --rebase origin main
          git push

      - name: Fail if report generation failed
        if: steps.detect.outcome == 'failure'
        run: |
          echo "::error::리포트 생성 실패 — 로그의 'Detect earnings filings' 단계를 확인하세요. 다음 실행에서 자동 재시도됩니다."
          exit 1
