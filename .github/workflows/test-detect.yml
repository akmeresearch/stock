name: Test report pipeline (one-off)
on:
  workflow_dispatch:
    inputs:
      ticker: { required: true }
      period: { required: true }
      rcept:  { required: true }
permissions: { contents: write }
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/detect_filings.py --test "${{ inputs.ticker }}" "${{ inputs.period }}" "${{ inputs.rcept }}"
      - run: |
          git config user.name akme-bot; git config user.email actions@users.noreply.github.com
          git add data/; git diff --cached --quiet || git commit -m "test: report pipeline ${{ inputs.ticker }}"; git pull --rebase origin main; git push
