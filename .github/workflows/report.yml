name: Generate earnings report

on:
  workflow_dispatch:
    inputs:
      ticker:
        description: "종목코드 (예: 005930)"
        required: true
      period:
        description: "분기 (예: 2026Q3)"
        required: true
      rcept:
        description: "DART 접수번호 (공시 원문을 직접 분석)"
        required: true
      urls:
        description: "추가 자료 URL (IR 보도자료, 컨콜 전문 등). 쉼표로 구분"
        required: false
      consensus:
        description: "컨센서스 (예: 영업이익 105.4조)"
        required: false
      price:
        description: "현재가/시총/PER (예: 206,750원 / 1,208조 / 9.3배)"
        required: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Generate report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          URL_ARGS=""
          IFS=',' read -ra URLS <<< "${{ inputs.urls }}"
          for u in "${URLS[@]}"; do [ -n "$u" ] && URL_ARGS="$URL_ARGS --url $u"; done
          python scripts/generate_report.py \
            --ticker "${{ inputs.ticker }}" \
            --period "${{ inputs.period }}" \
            --rcept "${{ inputs.rcept }}" \
            --consensus "${{ inputs.consensus }}" \
            --price "${{ inputs.price }}" $URL_ARGS

      - name: Commit report
        run: |
          git config user.name "akme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reports/
          git diff --cached --quiet || git commit -m "report: ${{ inputs.ticker }} ${{ inputs.period }}"
          git push
