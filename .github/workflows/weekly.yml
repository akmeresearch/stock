name: Weekly market brief

on:
  workflow_dispatch:
    inputs:
      end:
        description: "주의 마지막 날 (YYYY-MM-DD, 비우면 오늘)"
        required: false
  schedule:
    - cron: "0 9 * * 0"   # 매주 일요일 18:00 KST

permissions:
  contents: write

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Generate weekly brief
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          if [ -n "${{ inputs.end }}" ]; then python scripts/weekly_brief.py --end "${{ inputs.end }}"; else python scripts/weekly_brief.py; fi
      - name: Commit
        run: |
          git config user.name "akme-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/weekly/
          git diff --cached --quiet || git commit -m "weekly: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin main
          git push
