name: SEC backfill (one-off)
on:
  workflow_dispatch:
    inputs:
      days:
        description: "며칠 전까지 거슬러 감지할지"
        required: false
        default: "100"
permissions:
  contents: write
jobs:
  sec:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/detect_sec.py --days ${{ inputs.days }}
      - run: python scripts/build_index.py
      - env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python scripts/notify.py --reports
      - run: |
          git config user.name akme-bot; git config user.email actions@users.noreply.github.com
          git add data/; git diff --cached --quiet || git commit -m "report: SEC backfill"; git pull --rebase origin main; git push
