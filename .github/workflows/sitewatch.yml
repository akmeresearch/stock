name: Site watch (펩트론 공지·IR FAQ)

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: sitewatch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Watch
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python3 scripts/site_watch.py
      - name: Commit state
        run: |
          git config user.name "akme-bot"
          git config user.email "actions@users.noreply.github.com"
          [ -f data/site_watch_state.json ] && git add data/site_watch_state.json
          git diff --cached --quiet || (git commit -m "sitewatch: $(TZ=Asia/Seoul date +%Y-%m-%d\ %H:%M)" && git pull --rebase origin main && git push)
