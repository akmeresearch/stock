name: Telegram setup (one-off)
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - env: { TELEGRAM_BOT_TOKEN: "${{ secrets.TELEGRAM_BOT_TOKEN }}" }
        run: python scripts/notify.py --setup
      - run: |
          git config user.name akme-bot; git config user.email actions@users.noreply.github.com
          git add data/notify.json; git diff --cached --quiet || git commit -m "telegram: chat id"; git pull --rebase origin main; git push
