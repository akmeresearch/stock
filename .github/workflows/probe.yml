name: Probe (diagnostic)
on:
  workflow_dispatch:
    inputs:
      script:
        description: "scripts/ 아래 실행할 파일명"
        required: true
        default: "probe_kis_futures.py"
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache/kis_token.json
          key: kis-token-probe-${{ github.run_id }}
          restore-keys: kis-token-
      - env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          KIS_TOKEN_CACHE: .cache/kis_token.json
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/${{ inputs.script }}
